<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="frameBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <linearGradient id="innerBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d9d9d9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="frameShadow" x="-20%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="insetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main frame ring (center is transparent by even-odd fill rule) -->
  <g filter="url(#frameShadow)">
    <path
      fill="url(#frameBody)"
      fill-rule="evenodd"
      d="M0 0H1000V1400H0Z M120 106H880V1294H120Z"
    />
  </g>

  <!-- Outer highlights -->
  <rect x="14" y="14" width="972" height="1372" fill="none" stroke="#ffffff" stroke-width="20" opacity="0.9"/>
  <rect x="36" y="36" width="928" height="1328" fill="none" stroke="#dedede" stroke-width="4" opacity="0.9"/>

  <!-- Inner bevel around photo window -->
  <rect x="110" y="96" width="780" height="1208" fill="none" stroke="#fefefe" stroke-width="10" opacity="0.95"/>
  <rect x="120" y="106" width="760" height="1188" fill="none" stroke="url(#innerBevel)" stroke-width="16" opacity="0.9"/>
  <rect x="128" y="114" width="744" height="1172" fill="none" stroke="#f8f8f8" stroke-width="2" opacity="0.8"/>

  <!-- Soft inset around transparent window edge -->
  <rect x="120" y="106" width="760" height="1188" fill="none" stroke="#bbbbbb" stroke-width="1.5" opacity="0.35" filter="url(#insetShadow)"/>
</svg>
